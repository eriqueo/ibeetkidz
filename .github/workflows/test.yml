name: test

on:
  pull_request:
    branches: [main]
  # No `push: [main]` trigger: build-and-deploy.yml CALLS this workflow on every
  # push to main (workflow_call, below) so that `deploy` can `needs:` the e2e job.
  # Keeping a push trigger here too would run the whole suite twice per merge.
  workflow_call:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    # Permanent by design: each production Track journey is long and
    # graphics/audio heavy. Its own runner gives it a new browser process,
    # servers and audio graph instead of inheriting those from another journey.
    # The fan-out is bounded at three; GitHub queues jobs when that cap is full.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - suite: main
            browsers: chromium webkit firefox
          - suite: track-visual
            browsers: chromium
          - suite: track-focus
            browsers: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      # WebAudio needs a real audio sink; a headless runner has none, so start
      # PulseAudio — with no hardware it auto-creates a null sink. Chromium
      # additionally only pumps its audio graph when HEADED, so the suite runs
      # headed under a virtual display (xvfb) — otherwise the audio-output
      # spec's master-peak proof reads permanent silence.
      - run: sudo apt-get install -y pulseaudio && pulseaudio --start
      - name: Run the main browser suite
        if: matrix.suite == 'main'
        run: xvfb-run --auto-servernum npm run test:e2e -- --grep-invert track-release-evidence
        env:
          PW_CROSS_ENGINE: "1"
          PW_HEADED: "1"
      - name: Run the visual Track journey on a fresh runner
        if: matrix.suite == 'track-visual'
        run: >-
          xvfb-run --auto-servernum npm run test:e2e --
          tests/e2e/track-release-evidence.spec.ts --project=chromium
          --grep "produces reviewable release evidence"
        env:
          PW_HEADED: "1"
      - name: Run the focus and endless-Ride journey on a fresh runner
        if: matrix.suite == 'track-focus'
        run: >-
          xvfb-run --auto-servernum npm run test:e2e --
          tests/e2e/track-release-evidence.spec.ts --project=chromium
          --grep "@track-focus-release"
        env:
          PW_HEADED: "1"
      - name: Upload Track visual release evidence
        if: always() && matrix.suite != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: track-visual-release-evidence-${{ matrix.suite }}
          path: |
            test-results/**/track-*.png
            test-results/**/video.webm
          if-no-files-found: error
          retention-days: 14
