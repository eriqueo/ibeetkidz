name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The full gate (unit + e2e) as ONE source of truth — test.yml is reusable, so
  # the e2e setup (playwright engines, pulseaudio sink, xvfb) is defined once and
  # not copy-pasted here. `deploy` needs it, so a red e2e cannot reach Pages.
  tests:
    uses: ./.github/workflows/test.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install image-check dependencies
        run: python3 -m pip install --quiet -r scripts/requirements-ui-atlas.txt
      - name: AR-069 source alpha release gate
        run: bash scripts/check-ar069-alpha.sh
      - name: UI atlas freshness release gate
        run: bash scripts/check-ui-atlas-fresh.sh
      - name: Train atlas freshness release gate
        run: bash scripts/check-train-atlas-fresh.sh
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build # produces dist/ and dist-gh/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-gh

  deploy:
    needs: [build, tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
