name: asset-size

# Advisory only (decision A3: re-home art, don't police it). This lives in its
# own workflow ON PURPOSE: build-and-deploy.yml calls test.yml as a reusable
# workflow and its `deploy` job `needs:` that call, which waits on *every* job in
# it — so an advisory check parked in test.yml would sit in the deploy's
# dependency chain. Nothing here may ever be able to block a release.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  asset-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-asset-size.sh
      # Sprite alpha, unlike the size warning above, DOES fail: art with an
      # opaque background renders a rectangle over the scene. It lives in this
      # advisory workflow rather than test.yml only because test.yml sits in the
      # deploy's dependency chain and this needs no build to run.
      - name: sprite alpha export rule
        run: bash scripts/check-sprite-alpha.sh
      # The packed chrome atlas is a GENERATED artifact that is committed, and
      # the code loads the committed copy — so a sprite can be updated in
      # src/assets/sprites/ and simply never reach the game. It also carries the
      # de-wash step (see AR-009), which only runs at pack time: a hand-synced
      # atlas would quietly reintroduce the grey boxes behind every keycap.
      # Repack in a temporary directory. JSON is byte-deterministic; PNG pages
      # compare dimensions, color model, and decoded pixels so encoder-only
      # differences do not reject equivalent art.
      - name: ui atlas is regenerable from its sprites
        run: |
          python3 -m pip install --quiet -r scripts/requirements-ui-atlas.txt
          bash scripts/check-ui-atlas-fresh.sh
